apiVersion: apps/v1
kind: Deployment
metadata:
  name: tech-test-app
  labels:
    app: tech-test-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tech-test-app
  template:
    metadata:
      labels:
        app: tech-test-app
    spec:
      containers:
      - name: tech-test-app
        image: tech-test-app:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: tech-test-app
spec:
  selector:
    app: tech-test-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP 